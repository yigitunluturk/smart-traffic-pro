# ==============================================================================
# Traffic Speed & License Plate Recognition (SEN499 Graduation Project)
# System Configuration File
# ==============================================================================

project:
  name: "Automated Traffic Surveillance: Real-Time Speed & ALPR System"
  version: "1.0.0"
  course: "SEN499 Graduation Project"
  academic_year: "2026-2027"

# Deep Learning Model & Tracking Settings
model:
  vehicle_model: "yolo11m.pt"        # YOLO11m, yolo11s.pt, yolo11n.pt, yolov8n.pt
  vehicle_classes: [2, 3, 5, 7]      # COCO: 2:car, 3:motorcycle, 5:bus, 7:truck
  vehicle_conf: 0.40                 # Detection confidence threshold
  tracker: "botsort.yaml"            # botsort.yaml or bytetrack.yaml
  device: "cpu"                      # "cpu", "cuda", "0"

# Speed Estimation & Calibration Settings
speed:
  speed_limit: 80                    # km/h threshold for speeding violation
  base_resolution: [1280, 720]       # Base calibration reference resolution
  default_real_distance_m: 9.144     # Real distance between dashed road lines (meters)
  zones:
    - name: "Right_Lane"
      direction: "upward"
      entry_polygon: [[700, 575], [1100, 575], [1100, 560], [700, 560]]
      exit_polygon: [[700, 489], [1000, 489], [1000, 400], [700, 400]]
      calib_pixel_length: 86.0
      real_distance_m: 9.144
      color_entry: [0, 255, 255]     # BGR: Yellow
      color_exit: [0, 0, 255]        # BGR: Red

    - name: "Left_Lane"
      direction: "downward"
      entry_polygon: [[320, 466], [580, 466], [580, 480], [320, 480]]
      exit_polygon: [[200, 540], [550, 540], [520, 660], [70, 660]]
      calib_pixel_length: 74.0
      real_distance_m: 9.144
      color_entry: [0, 255, 255]
      color_exit: [0, 0, 255]

# Automatic License Plate Recognition (ALPR) Settings
plate:
  detector_model: "yolo-v9-t-384-license-plate-end2end"
  ocr_model: "cct-s-v2-global-model"
  zone_top_ratio: 0.40               # OCR band start ratio from top
  zone_bottom_ratio: 0.95            # OCR band end ratio
  min_ocr_conf: 0.40                 # Minimum valid character recognition confidence
  n_valid_reads: 3                   # Stable read lock threshold
  plate_format: "all"                # "all", "tr", "eu"

# Persistent Storage & Output Settings
output:
  database_path: "output/traffic_surveillance.db"
  save_csv: true
  csv_path: "output/arac_kayitlari.csv"
  save_violation_snapshots: true
  violations_dir: "output/ihlaller"
  save_video: true
  output_video_path: "output/output_combined.mp4"
  show_window: false
  hud_stats: true
